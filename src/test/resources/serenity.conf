serenity {
    project.name = "PetStay - Automatización Front-End"
    # FOR_EACH_ACTION deja una captura por acción (ideal para la documentación viva y la sustentación).
    # Si la suite se vuelve lenta, cámbialo a FOR_FAILURES.
    take.screenshots = FOR_EACH_ACTION
    # Navegador nuevo por escenario: PetStay guarda sus datos en el navegador y no deben mezclarse.
    restart.browser.for.each = scenario
}

# Localmente se ve el navegador. En GitHub Actions se ejecuta con -Dheadless.mode=true
headless.mode = false

webdriver {
    driver = chrome
    # PetStay está en Render: la primera carga puede tardar. Tiempo máximo (ms) para encontrar un elemento.
    timeouts.implicitlywait = 15000
    capabilities {
        browserName = "chrome"
        acceptInsecureCerts = true
        "goog:chromeOptions" {
            args = ["--window-size=1366,900", "--no-sandbox", "--disable-dev-shm-usage",
                    "--disable-gpu", "--remote-allow-origins=*", "--disable-infobars",
                    "--disable-notifications"]
        }
    }
}
